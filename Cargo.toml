[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "spikes"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/DerekParks/NotIntoIt"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"

[profile.dev.package."*"]
# Keep dependency compilation tolerable; spikes are I/O and FFI heavy anyway.
opt-level = 2

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
