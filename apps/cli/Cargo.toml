[package]
name = "nii"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "LLM-assisted US tax prep: an MCP server that fills real IRS forms"
homepage = "https://github.com/DerekParks/NotIntoIt"

[dependencies]
anyhow.workspace = true
base64 = "0.23.1"
clap = { version = "4.6.1", features = ["derive", "env"] }
dirs = "7.0.0"
indicatif = "0.18.6"
nii-core = { version = "0.1.0", path = "../../crates/core" }
nii-corpus = { version = "0.1.0", path = "../../crates/corpus" }
nii-embed = { version = "0.1.0", path = "../../crates/embed" }
nii-pdf = { version = "0.1.0", path = "../../crates/pdf" }
nii-search = { version = "0.1.0", path = "../../crates/search" }
open = "5.4.4"
rmcp = { version = "3.5.1", features = ["server", "transport-io", "macros"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync"] }
